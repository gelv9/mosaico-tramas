[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mosaico-tramas"
version = "0.1.0"
description = "Generador de mosaicos por tramas (hatching by numbers) en PDF imprimible."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pillow>=10.3",
    "reportlab>=4.1",
    "streamlit>=1.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pypdf>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mosaico_tramas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
